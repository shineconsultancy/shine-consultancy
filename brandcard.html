<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SHINE</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;overflow:hidden;}
.shine{font-family:'Cormorant Garamond',serif;font-size:22vw;font-weight:600;color:#ffffff;letter-spacing:2vw;line-height:1;}
.div{width:14vw;height:1px;background:#C8A04C;}
.sub{font-family:'Montserrat',sans-serif;font-size:3vw;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#C8A04C;}
.by{font-family:'Cormorant Garamond',serif;font-size:4.5vw;font-style:italic;font-weight:300;color:rgba(255,255,255,0.5);}
.url{font-family:'Montserrat',sans-serif;font-size:2.5vw;font-weight:300;letter-spacing:2px;color:rgba(200,160,76,0.6);}
.tag{font-family:'Cormorant Garamond',serif;font-size:3.8vw;font-style:italic;font-weight:300;color:rgba(255,255,255,0.18);text-align:center;margin-top:3vh;padding:0 6vw;}
</style>
</head>
<body>
<div class="shine">SHINE</div>
<div class="div"></div>
<div class="sub">Stage Confidence®</div>
<div class="by">by Monica Semedo</div>
<div class="url">shine-consultancy.lu</div>
<div class="tag">The Floor Is Yours. Let your presence shine.</div>
</body>
</html>
